
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>
    <link rel="stylesheet" href="patientreg.css">
</head>
<body>

    <header class="header">
        <h1>Prison Cell Management System</h1>
        <p>Safety | Security | Better Tomorrow</p>
    </header>

    <main class="container">

        <section class="page-title">
            <h2>Patient Registration Form</h2>
            <p>Register a Prisoner for Medical Care</p>
        </section>

        <form action="#" method="post" enctype="multipart/form-data">

            <fieldset>
                <legend>Personal Information</legend>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="name">Prisoner Full Name:</label>
                        <input type="text" id="name" name="name"
                               placeholder="Enter full name" required>
                    </div>

                    <div class="form-group">
                        <label for="patientid">Prisoner ID:</label>
                        <input type="text" id="patientid" name="patientid"
                               placeholder="Enter patient ID" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth:</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender:</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="blood">Blood Group:</label>
                        <select id="blood" name="blood">
                            <option value="">Select Blood Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="photo">Prisoner Photo:</label>
                        <input type="file" id="photo" name="photo"
                               accept="image/*">
                    </div>

                </div>
            </fieldset>

            <fieldset>
                <legend>Prison Information</legend>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="cell">Cell Number:</label>
                        <input type="text" id="cell" name="cell"
                               placeholder="Enter cell number" required>
                    </div>

                    <div class="form-group">
                        <label for="block">Assigned Block:</label>
                        <select id="block" name="block" required>
                            <option value="">Select Block</option>
                            <option value="A">Block A</option>
                            <option value="B">Block B</option>
                            <option value="C">Block C</option>
                            <option value="D">Block D</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="admission">Admission Date:</label>
                        <input type="date" id="admission"
                               name="admission" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="case">Case Reference:</label>
                        <input type="text" id="case" name="case"
                               placeholder="Enter case reference">
                    </div>

                </div>
            </fieldset>

            <fieldset>
                <legend>Medical Information</legend>

                <div class="form-grid">

                    <div class="form-group full-width">
                        <label for="condition">Current Medical Condition:</label>
                        <textarea id="condition" name="condition"
                                  rows="4"
                                  placeholder="Describe medical condition"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="allergy">Known Allergies:</label>
                        <input type="text" id="allergy" name="allergy"
                               placeholder="Enter known allergies">
                    </div>

                    <div class="form-group">
                        <label for="doctor">Assigned Doctor:</label>
                        <input type="text" id="doctor" name="doctor"
                               placeholder="Enter doctor's name">
                    </div>

                    <div class="form-group">
                        <label for="emergency">Emergency Contact Number:</label>
                        <input type="tel" id="emergency" name="emergency"
                               placeholder="Enter contact number">
                    </div>

                </div>
            </fieldset>

            <fieldset>
                <legend>Confirmation</legend>

                <div class="confirmation">
                    <input type="checkbox" id="confirm"
                           name="confirm" required>
                    <label for="confirm">
                        I confirm that the patient information is correct.
                    </label>
                </div>
            </fieldset>

            <div class="buttons">
                <input type="submit" value="Register Patient">
                <input type="reset" value="Clear Form">
            </div>

        </form>

        <footer>
            <p>
                <a href="../commonui/index.html">Back to Home</a>
                <span>|</span>
                <a href="../commonui/login.html">Login</a>
            </p>
            <p class="footer-text">Prison Cell Management System</p>
        </footer>

    </main>

</body>
</html>
